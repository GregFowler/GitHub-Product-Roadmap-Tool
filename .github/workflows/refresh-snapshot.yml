name: Refresh roadmap snapshot

on:
  schedule:
    # Monday 06:00 UTC
    - cron: "0 6 * * 1"
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, milestoned, demilestoned]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roadmap-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh snapshot
        env:
          ROADMAP_TOKEN: ${{ secrets.ROADMAP_TOKEN }}
        run: |
          if [ -z "${ROADMAP_TOKEN}" ]; then
            echo "ROADMAP_TOKEN is not configured. Skipping snapshot refresh."
            exit 0
          fi
          node scripts/snapshot.js

      - name: Commit snapshot if it changed
        run: |
          if git diff --quiet -- data/roadmap.json; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roadmap.json
          git commit -m "Refresh roadmap snapshot"
          git push
